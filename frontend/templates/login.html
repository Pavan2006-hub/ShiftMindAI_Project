
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ShiftMind AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-body">

<div class="login-container">

    <div class="login-brand">
        <div class="brand-icon large">S</div>
        <h1>ShiftMind <span>AI</span></h1>
        <p>Intelligent Incident Response & Shift Management</p>
    </div>

    <div class="login-card">

        <h2>Welcome Back</h2>
        <p class="login-description">Sign in to access your operations workspace.</p>

        <form id="loginForm">

            <div class="form-group">
    <label for="password">Password</label>

    <div class="password-input-wrap">

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            data-password-field
            required
        >

        <button
            type="button"
            class="password-toggle"
            data-password-toggle
            aria-label="Show password"
            aria-pressed="false"
        >

            <svg class="password-eye-show"
                 viewBox="0 0 24 24"
                 aria-hidden="true">

                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>

            </svg>

            <svg class="password-eye-hide"
                 viewBox="0 0 24 24"
                 aria-hidden="true">

                <path d="m3 3 18 18"/>
                <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7s-3.6 7-10 7c-1.5 0-2.8-.4-4-.9"/>

            </svg>

        </button>

    </div>
</div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div id="loginError" class="alert alert-error" hidden></div>

            <button type="submit" class="primary-button" id="loginButton">
                Sign In
            </button>

        </form>

        <div class="login-footer">
            Protected access for authorized engineers.
        </div>

    </div>

    <p class="login-copyright">© 2026 ShiftMind AI. All rights reserved.</p>

</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
